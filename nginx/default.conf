# DeployFlow Nginx server configuration.
# Copied over the image's stock /etc/nginx/conf.d/default.conf, so this is
# the only server block Nginx loads. Nothing listens on port 80.

server {
    # Serve on port 8081 inside the container.
    # IPv4 only, on purpose: Docker's default bridge network gives containers no
    # IPv6 address and forwards published ports (-p 8081:8081) over IPv4.
    # A fixed "listen [::]:8081;" would stop Nginx from starting on any host
    # where IPv6 is unavailable.
    listen       8081;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
